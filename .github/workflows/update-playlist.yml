name: Update playlist metadata

on:
  schedule:
    # Every Monday at 06:00 UTC. Adjust the cron if the channel publishes on a
    # different schedule.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      enrich:
        description: "Use OPENAI_API_KEY or GEMINI_API_KEY to draft summaries for new chapters (never published automatically)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: playlist-update
  cancel-in-progress: false

jobs:
  update:
    name: Refresh metadata and open a review PR
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python tooling
        run: python -m pip install -r requirements.txt

      - name: Refresh playlist and regenerate site content
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.0-flash' }}
        run: |
          set -euo pipefail
          args=()
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.enrich }}" = "true" ]; then
            args+=(--enrich)
          fi
          python scripts/update_repository.py "${args[@]}"

      - name: Open or update the review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: refresh playlist metadata and generated pages"
          branch: automation/playlist-update
          delete-branch: true
          title: "chore: weekly playlist metadata update"
          body: |
            Automated playlist refresh for the EINITIAL24 Academy Kali Linux course.

            **What changed**
            - `data/playlist.json` and `data/playlist-metadata.json` were refreshed.
            - Lesson pages, the lesson index, README curriculum table, search index, `_data/course.json`, `llms.txt` and `sitemap.xml` were regenerated.
            - Validation ran before this PR was opened.

            **Review required**
            - Check every new or changed title, duration and publish date against YouTube.
            - If a new chapter has no authored notes, review `data/curriculum-drafts.json` and author `data/curriculum.json`. The generated page is metadata-only until then.
            - AI-assisted drafts are marked `ai_assisted` and `review_required`. They must not be published without human review.
            - Scheduled chapters must keep `duration: null` and `published_date: null` and must not receive a `VideoObject`.

            This workflow never pushes directly to `main`. Merge only after review.

            Generated by `.github/workflows/update-playlist.yml`.
          add-paths: |
            README.md
            _data/
            assets/data/
            data/
            docs/
            lessons/
            resources/
            llms.txt
            sitemap.xml
