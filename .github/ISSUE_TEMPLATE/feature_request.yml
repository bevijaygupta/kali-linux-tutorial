name: Feature request
description: Suggest a site, automation or learning-resource improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Explain the learner problem first, then the proposed solution. Features that add convenience without improving accuracy, safety or accessibility are unlikely to be accepted.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the learner or maintainer need.
      placeholder: "It is hard to find lessons by module on mobile because ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change and where it would live.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, or why the current behaviour is insufficient.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Lesson content
        - Documentation
        - Resources
        - Site design or navigation
        - Search
        - Accessibility
        - SEO and structured data
        - Python automation
        - GitHub Actions
        - Other

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: The request does not involve re-hosting videos, publishing transcripts or attacking third parties.
          required: true
        - label: The request does not require inventing metadata or unverifiable claims.
          required: true
        - label: I have checked for an existing issue or pull request.
          required: false
