<a class="skip-link" href="#main-content">Skip to content</a>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
      <img src="{{ '/assets/images/logo.svg' | relative_url }}" alt="" width="36" height="36">
      <span class="brand-text">
        <strong>Kali Linux</strong>
        <small>Tutorials · EINITIAL24</small>
      </span>
    </a>

    <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav">
      <span class="visually-hidden">Menu</span>
      <span class="nav-toggle-bars" aria-hidden="true"><span></span><span></span><span></span></span>
    </button>

    <nav class="site-nav" id="site-nav" aria-label="Main navigation">
      <a href="{{ '/lessons/' | relative_url }}"{% if page.url contains '/lessons/' %} aria-current="page"{% endif %}>Lessons</a>
      <a href="{{ '/docs/' | relative_url }}"{% if page.url contains '/docs/' %} aria-current="page"{% endif %}>Documentation</a>
      <a href="{{ '/resources/' | relative_url }}"{% if page.url contains '/resources/' %} aria-current="page"{% endif %}>Resources</a>
      <a href="{{ site.repository_url }}" rel="noopener">GitHub</a>
      <a class="button button-primary header-cta" href="{{ site.playlist_url }}" target="_blank" rel="noopener noreferrer">Watch course</a>
    </nav>

    <div class="header-actions">
      <button class="icon-button" type="button" data-search-open aria-label="Search lessons" aria-haspopup="dialog">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      </button>
      <button class="icon-button" type="button" data-theme-toggle aria-label="Switch color theme" aria-pressed="false">
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path></svg>
      </button>
    </div>
  </div>
</header>

<div class="search-overlay" data-search-overlay hidden role="dialog" aria-modal="true" aria-labelledby="search-title">
  <div class="search-panel">
    <div class="search-panel-head">
      <h2 id="search-title">Search lessons</h2>
      <button class="icon-button" type="button" data-search-close aria-label="Close search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
      </button>
    </div>
    <div class="lesson-search" data-lesson-search>
      <label class="visually-hidden" for="search-overlay-input">Search lessons</label>
      <input id="search-overlay-input" type="search" data-search-input autocomplete="off" placeholder="Search by tool, topic or chapter…">
      <p class="search-hint" data-search-hint>Type at least two characters. Press Escape to close.</p>
      <div class="search-results" data-search-results aria-live="polite"></div>
    </div>
  </div>
</div>
